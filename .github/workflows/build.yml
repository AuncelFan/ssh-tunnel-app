name: Tauri verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install locked React dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Rust format, tests and lint
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: React tests
        run: pnpm test:frontend
      - name: CI profile isolation tests
        run: node --test scripts/native-ci-profile.test.mjs
      - name: Release-profile desktop build
        run: pnpm build:release
      - name: Ensure Windows WebView2 runtime
        if: runner.os == 'Windows'
        run: ./scripts/ensure-webview2.ps1
      - name: Windows release executable smoke
        if: runner.os == 'Windows'
        run: ./scripts/native-ci-windows.ps1
      - name: Stage Windows release executable
        if: runner.os == 'Windows'
        run: pnpm stage:windows
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-windows-${{ github.sha }}
          path: build/bin/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS build-verification executable
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-macos-${{ runner.arch }}-${{ github.sha }}
          path: target/release/ssh-tunnel
          if-no-files-found: error
          retention-days: 14
      - name: Upload isolated Windows test evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ github.sha }}
          path: |
            target/native-smoke/**/*.png
            target/native-smoke/**/failure.json
            target/native-smoke/**/binary.json
            target/native-smoke/**/native-startup-*.log
            target/native-ci/**/result.json
            target/native-ci/**/worker.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve failed Windows run executable for diagnosis
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostic-executable-${{ github.sha }}
          path: target/release/ssh-tunnel.exe
          if-no-files-found: ignore
          retention-days: 7

# Build artifacts only; publishing a release is a separate explicit action.
